<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>404 | Bautista Avila</title>
    <meta name="robots" content="noindex">
    <base href="/">

    <link rel="icon" type="image/webp" href="assets/images/favicon.webp">

    <link rel="preload" href="assets/images/backgrounds/rocket.webp" as="image" type="image/webp">
    <script src="assets/js/i18n.js" defer></script>

    <style>
      @font-face {
        font-family: 'Inter';
        src: url('assets/fonts/inter-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Inter';
        src: url('assets/fonts/inter-900.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --slate-50: #f8fafc;
        --slate-400: #94a3b8;
        --slate-600: #475569;
        --slate-900: #0f172a;
        --slate-950: #020617;
        --blue-500: #3b82f6;
        --blue-400: #60a5fa;
        --radius: 6px;
        --text: var(--slate-50);
        --accent: var(--blue-400);
        --accent-soft: rgba(96, 165, 250, 0.15);
        --border: var(--slate-600);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 400;
        color: var(--text);
        background: var(--slate-950);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        padding: clamp(12px, 3vh, 24px) clamp(12px, 4vw, 24px);
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -2;
        background: url('assets/images/backgrounds/rocket.webp') center / cover no-repeat, var(--slate-950);
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          180deg,
          rgba(2, 6, 23, 0.55) 0%,
          rgba(2, 6, 23, 0.32) 45%,
          rgba(2, 6, 23, 0.92) 100%
        );
      }

      h1 {
        font-weight: 900;
      }

      .wrapper {
        margin: auto;
        width: 100%;
        max-width: 400px;
      }

      .card {
        width: 100%;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: clamp(20px, 4vh, 32px) clamp(16px, 5vw, 28px);
      }

      .name {
        text-align: center;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }

      .subtitle {
        text-align: center;
        color: var(--slate-400);
        font-size: 0.9rem;
        margin-top: 4px;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: clamp(14px, 2.5vh, 24px) 0;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 1.5vh, 12px);
      }

      .link-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        text-decoration: none;
        font-size: 0.95rem;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
      }

      .link-btn .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--accent);
      }

      .link-btn:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .link-btn:active {
        transform: scale(0.98);
      }

      .link-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (max-height: 640px) {
        .card {
          padding: 16px;
        }

        .name {
          font-size: 1.1rem;
        }

        .subtitle {
          font-size: 0.8rem;
        }

        .divider {
          margin: 12px 0;
        }

        .links {
          gap: 8px;
        }

        .link-btn {
          padding: 9px 12px;
          font-size: 0.88rem;
        }
      }

      @media (max-width: 380px) {
        .link-btn {
          padding: 11px 12px;
        }
      }

      @media (hover: none) {
        .link-btn:hover {
          transform: none;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        body::before,
        body::after,
        .card {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }

        .card {
          background: var(--slate-900);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <div class="card">
        <h1 class="name" data-i18n="notFound.code">Error 404</h1>
        <p class="subtitle" data-i18n="notFound.text">Esa página no existe o el link está desactualizado.</p>

        <hr class="divider">

        <div class="links">
          <a href="index.html" class="link-btn">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            <span data-i18n="notFound.cta">Volver al inicio</span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
